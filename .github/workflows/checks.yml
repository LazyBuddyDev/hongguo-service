name: Hongguo service checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python service tests
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m venv .venv
          & .venv/Scripts/python.exe -m pip install --disable-pip-version-check --no-cache-dir .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -B scripts/check-changes.py --base "$env:BASE_SHA"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
